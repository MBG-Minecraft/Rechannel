import org.apache.tools.ant.filters.ReplaceTokens

buildscript {
	apply from: 'dependencies.gradle'
}

plugins {
	id 'org.jetbrains.kotlin.jvm' version '2.3.21'
	id 'com.gradleup.shadow' version '9.6.0'
	id 'application'
	id 'java'
}

application {
	mainClass = 'com.mrbeastmc.rechannel.Application'
}

def supportedJava = 25
version = '1.5'

java {
    toolchain.languageVersion.set(JavaLanguageVersion.of(supportedJava))
}

tasks.withType(JavaCompile).configureEach {
	options.compilerArgs += ['-source', '' + supportedJava, '-target', '' + supportedJava]
}

compileTestJava.options.encoding = 'UTF-8'
compileJava.options.encoding = 'UTF-8'

repositories {
	mavenCentral()
}

configurations {
	shadow
	implementation.extendsFrom shadow
}

dependencies {
	// DAVE is Discord Audio Video Engine. Required for voice support in JDA.
	shadow("club.minnced:jdave-api:0.1.8")

	// Compiled natives for libdave for the specified platform
	shadow("club.minnced:jdave-native-linux-x86-64:0.1.8")
	shadow("club.minnced:jdave-native-linux-aarch64:0.1.8")
	shadow("club.minnced:jdave-native-win-x86-64:0.1.8")
	shadow("club.minnced:jdave-native-darwin:0.1.8")

	shadow "org.jetbrains.kotlin:kotlin-stdlib:${project.kotlin_version}"
	shadow "org.reflections:reflections:${project.reflections_version}"
	shadow "com.google.code.gson:gson:${project.gson_version}"
	shadow "net.dv8tion:JDA:${project.jda_version}"
	shadow fileTree(dir: 'libs', include: ['*.jar'])
}

shadowJar {
	configurations = [project.configurations.shadow]
}

tasks.build.dependsOn shadowJar

processResources {
	filter ReplaceTokens, tokens: [
		'version' : project.version,
	]
}
